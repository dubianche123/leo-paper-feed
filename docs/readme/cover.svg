<text x="52" y="190" font-size="22" fill="#C2CFE1" font-weight="400" text-anchor="start">From structured JSON</text>
<text x="52" y="223" font-size="22" fill="#C2CFE1" font-weight="400" text-anchor="start">to a readable stream of notes.</text>
<text x="52" y="350" font-size="17" fill="#8EA4BF" font-weight="400" text-anchor="start">— One versioned public data file.</text>
<text x="52" y="379" font-size="17" fill="#8EA4BF" font-weight="400" text-anchor="start">— Dates, channels and Markdown content.</text>
<text x="52" y="408" font-size="17" fill="#8EA4BF" font-weight="400" text-anchor="start">— A documented contract for reader clients.</text>
<text x="52" y="486" font-size="12" fill="#6F86A4" font-weight="700" text-anchor="start">PROJECT OVERVIEW  /  SCHEMATIC</text>
