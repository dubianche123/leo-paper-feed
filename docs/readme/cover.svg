<text x="717" y="126" font-size="16" fill="#DFE8F5" font-weight="400" text-anchor="start">days[]</text>
<text x="717" y="150" font-size="16" fill="#DFE8F5" font-weight="400" text-anchor="start">  date · model · channels[]</text>
<text x="717" y="174" font-size="16" fill="#DFE8F5" font-weight="400" text-anchor="start">    id · title · content · items?</text>
